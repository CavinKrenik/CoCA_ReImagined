<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">CoCA Center on Contemporary Art logo</title>
  <desc id="desc">Red geometric CoCA lettermark with dark Center on Contemporary Art wordmark on a transparent background.</desc>

  <defs>
    <mask id="c-cut-left" maskUnits="userSpaceOnUse" x="35" y="35" width="275" height="275">
      <rect x="35" y="35" width="275" height="275" fill="#fff"/>
      <circle cx="172" cy="172" r="23" fill="#000"/>
      <rect x="172" y="160" width="138" height="24" fill="#000"/>
    </mask>
    <mask id="c-cut-right" maskUnits="userSpaceOnUse" x="600" y="35" width="275" height="275">
      <rect x="600" y="35" width="275" height="275" fill="#fff"/>
      <circle cx="737" cy="172" r="23" fill="#000"/>
      <rect x="737" y="160" width="138" height="24" fill="#000"/>
    </mask>
    <mask id="o-cut" maskUnits="userSpaceOnUse" x="320" y="42" width="250" height="250">
      <rect x="320" y="42" width="250" height="250" fill="#fff"/>
      <circle cx="445" cy="172" r="23" fill="#000"/>
    </mask>
    <mask id="a-cut" maskUnits="userSpaceOnUse" x="885" y="30" width="320" height="270">
      <rect x="885" y="30" width="320" height="270" fill="#fff"/>
      <circle cx="1045" cy="172" r="23" fill="#000"/>
    </mask>
  </defs>

  <g id="coca-mark" fill="#ff3526">
    <circle cx="172" cy="172" r="137" mask="url(#c-cut-left)"/>
    <rect x="320" y="42" width="250" height="250" mask="url(#o-cut)"/>
    <circle cx="737" cy="172" r="137" mask="url(#c-cut-right)"/>
    <path d="M1045 30 885 300h320z" mask="url(#a-cut)"/>
  </g>

  <text id="wordmark"
        x="620"
        y="385"
        fill="#171717"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="54"
        font-weight="300"
        letter-spacing="2.5"
        text-anchor="middle">CENTER ON CONTEMPORARY ART</text>
</svg>
